<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"  />
    <link rel="stylesheet" href="style.css">
    <title>Giriş Yap</title>
</head>
<body>
    <header>
        <nav class="navbar bg-dark border-bottom border-body navbar-expand-lg" data-bs-theme="dark">
            <div class="container">
                <a href="login.html" class="navbar-brand">Halikarnas Admin</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a href="login.html" class="nav-link active">Giriş</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card shadow">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0 text-center">Giriş Yap</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-danger">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> E-Posta ya da parola hatalı.
                        </div>
                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-Posta</label>
                                <input type="email" id="email" class="form-control" placeholder="ornek@alanadi.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Parola</label>
                                <input type="password" id="password" class="form-control" placeholder="••••••••">
                            </div>
                           <a href="index.html" class="btn btn-primary w-100 py-2">
                            Giriş Yap
                        </a>
                        </form>
                    </div>
                </div>
            </div>
        
        </div>
      
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
