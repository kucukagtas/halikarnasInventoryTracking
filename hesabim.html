</head>

                <a href="index.html" class="navbar-brand">Halikarnas Admin</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a href="kategori.html" class="nav-link">Kategoriler</a>
                        </li>
                        <li class="nav-item">
                            <a href="urun.html" class="nav-link">Ürünler</a>
                        </li>
                        <li class="nav-item">
                            <a href="slider.html" class="nav-link">Slider</a>
                        </li>
                        <li class="nav-item">
                            <a href="role.html" class="nav-link">Yetki</a>
                        </li>
                        <li class="nav-item">
                            <a href="kullanici.html" class="nav-link">Kullanıcı</a>
                        </li>
                        <li class="nav-item">

                        </li>
                    </ul>
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a href="#" class="nav-link dropdown-toggle active" data-bs-toggle="dropdown">G. Kaya</a>
                            <ul class="dropdown-menu">
                                <li><a href="hesabim.html" class="dropdown-item active">Hesabım</a></li>

                            <a href="login.html" class="nav-link">Çıkış</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <main class="container my-3">
        <div class="row g-3">
            <div class="col-md-4 col-lg-3">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <img src="img/user.png" class="img-thumbnail img-preview-box rounded-circle" alt="">
                        <input type="file" class="form-control mt-3">
                    </div>
                </div>
            </div>
            <div class="col-md-8 col-lg-9">
                <div class="card shadow mb-3">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0">Kullanıcı Bilgileri</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="row mb-3">
                                <label for="username" class="col-sm-3 col-lg-2 col-form-label">Kullanıcı Adı</label>
                                <div class="col-sm-9 col-lg-10">
                                    <input type="text" id="username" class="form-control" value="gkaya" disabled>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="adsoyad" class="col-sm-3 col-lg-2 col-form-label">Ad Soyad</label>
                                <div class="col-sm-9 col-lg-10">
                                    <input type="text" id="adsoyad" class="form-control" value="G. Kaya">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="email" class="col-sm-3 col-lg-2 col-form-label">E-Posta</label>
                                <div class="col-sm-9 col-lg-10">
                                    <input type="email" id="email" class="form-control" value="gkaya@gmail.com">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-9 col-lg-10 offset-sm-3 offset-lg-2">
                                    <button type="submit" class="btn btn-primary">Kaydet</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card shadow">
                    <div class="card-header py-2">
                        <h5 class="card-title mb-0">Parola Güncelle</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="row mb-3">
                                <label for="password" class="col-sm-3 col-lg-2 col-form-label">Parola</label>
                                <div class="col-sm-9 col-lg-10">
                                    <input type="password" id="password" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="password2" class="col-sm-3 col-lg-2 col-form-label">Parola Tekrar</label>
                                <div class="col-sm-9 col-lg-10">
                                    <input type="password" id="password2" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-9 col-lg-10 offset-sm-3 offset-lg-2">
                                    <button type="submit" class="btn btn-primary">Kaydet</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        
        </div>
      
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
